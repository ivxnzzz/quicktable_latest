name: Verify QuickTable
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q quicktable tools tests
  qgis:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:3.44.15-trixie
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      PYTHONPATH: /usr/share/qgis/python
    steps:
      - uses: actions/checkout@v4
      - name: Run QGIS and disk-provider regressions
        run: python3 tests/run_qgis_tests.py
      - name: Build release package
        run: python3 tools/package_plugin.py
      - name: Load packaged plugin in an isolated profile
        run: python3 tools/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: quicktable-verified-package
          path: dist/*.zip
          if-no-files-found: error
